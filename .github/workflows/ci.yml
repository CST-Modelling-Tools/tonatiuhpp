name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is needed to compute PR merge-bases and push diffs.
          fetch-depth: 0

      # Pin Python to avoid accidental "too-new" versions on runners
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Classify changed paths per platform to preserve the existing stable
      # build (OS) check names: path-filtered workflows can leave required checks
      # pending, while skipped jobs do not run meaningful doc validation.
      # Conservatively run full native CI unless ALL changed paths end in .md.
      - name: Classify changed files
        id: changes
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$CI_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Manual run: full native CI'
            exit 0
          fi
          if [[ -z "$CI_BASE_SHA" || -z "$CI_HEAD_SHA" ]]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Missing revision: full native CI'
            exit 0
          fi
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            range="${CI_BASE_SHA}...${CI_HEAD_SHA}"
          elif [[ "$CI_EVENT_NAME" == "push" ]]; then
            range="${CI_BASE_SHA} ${CI_HEAD_SHA}"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Unrecognized event: full native CI'
            exit 0
          fi
          paths="$RUNNER_TEMP/tonatiuhpp-ci-changed-paths.z"
          if [[ "$CI_EVENT_NAME" == "push" ]]; then
            if ! git diff --no-renames --name-only -z "$CI_BASE_SHA" "$CI_HEAD_SHA" > "$paths"; then
              echo 'docs_only=false' >> "$GITHUB_OUTPUT"
              echo 'Unable to diff push revisions: full native CI'
              exit 0
            fi
          elif ! git diff --no-renames --name-only -z "$range" > "$paths"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Unable to diff PR revisions: full native CI'
            exit 0
          fi
          python scripts/ci_change_classifier.py "$paths" | tee -a "$GITHUB_OUTPUT"

      - name: Test CI change classifier
        shell: bash
        run: python -m unittest discover -s tests/ci -p 'test_ci_change_classifier.py' -v

      - name: Verify documentation-only changes
        if: ${{ steps.changes.outputs.docs_only == 'true' }}
        shell: bash
        run: python scripts/ci_change_classifier.py --check-docs "$RUNNER_TEMP/tonatiuhpp-ci-changed-paths.z"

      # Qt: use same mechanism everywhere to reduce OS-specific packaging pain
      - name: Install Qt
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          cache: true

      # Make Qt discoverable for both CMake and your compile probes on macOS/Linux
      - name: Export Qt prefix (macOS/Linux)
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os != 'Windows') }}
        shell: bash
        run: |
          set -euo pipefail

          # install-qt-action typically provides Qt6_DIR (…/lib/cmake/Qt6)
          if [ -n "${Qt6_DIR:-}" ] && [ -d "${Qt6_DIR}" ]; then
            QT_PREFIX="$(cd "${Qt6_DIR}/../../.." && pwd)"
          elif [ -n "${QT_ROOT_DIR:-}" ] && [ -d "${QT_ROOT_DIR:-}" ]; then
            QT_PREFIX="${QT_ROOT_DIR}"
          else
            echo "Qt prefix not found via Qt6_DIR or QT_ROOT_DIR" >&2
            exit 1
          fi

          echo "TONATIUH_QT_ROOT=${QT_PREFIX}" >> "$GITHUB_ENV"
          echo "Qt6_DIR=${QT_PREFIX}/lib/cmake/Qt6" >> "$GITHUB_ENV"

          # Prefer Qt prefix first in CMake discovery
          echo "CMAKE_PREFIX_PATH=${QT_PREFIX}:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

          # pkg-config sometimes helps transitive detection in projects
          if [ -d "${QT_PREFIX}/lib/pkgconfig" ]; then
            echo "PKG_CONFIG_PATH=${QT_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          fi

          # Runtime loader path for probe executables (esp. Linux)
          if [ -d "${QT_PREFIX}/lib" ]; then
            echo "LD_LIBRARY_PATH=${QT_PREFIX}/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi

      # IMPORTANT on Windows: without a dev cmd, cl.exe may run but miss standard headers (crtdbg.h, etc.)
      - name: Set up MSVC dev environment (Windows)
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os == 'Windows') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Python deps (+ Ninja)
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml ninja "sphinx>=7,<9"

      - name: Build runtime help
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          python scripts/build_runtime_help.py
          test -f help/html/index.html

      - name: Verify benchmark v2 reference artifacts
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          python tests/scientific/verify_reference_v2.py

      # Synthetic fixture checks only the offline *auditor* logic.
      # It does not run 500 million rays and cannot close the full A0 gate.
      - name: Test frozen 500M artifact auditor
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          python -m unittest discover -s tests/scientific -p 'test_audit_500m_benchmark.py' -v

      - name: Test GUI Flux Analysis export comparator
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          python -m unittest discover -s tests/scientific -p 'test_compare_gui_flux_exports.py' -v

      - name: Install Boost + Eigen + image codecs (Ubuntu)
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os == 'Linux') }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-dev \
            libeigen3-dev \
            libsimage-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config \
            ninja-build

      - name: Install Boost + Eigen (macOS)
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os == 'macOS') }}
        shell: bash
        run: |
          brew update
          brew install boost eigen

      # Cache version-pinned source archives, not extracted files. Revalidate ZIP
      # signatures and extracted headers even on cache hits.
      - name: Cache Windows Boost and Eigen archives
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os == 'Windows') }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/boost_1_90_0.zip
            ${{ runner.temp }}/eigen-5.0.0.zip
          key: windows-header-archives-v1-boost-1.90.0-eigen-5.0.0

      # Windows: follow the Tonatiuh++ blog approach: download + extract headers (fast, predictable)
      - name: Install Boost + Eigen headers (Windows, download)
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # -------------------------
          # Boost headers (zip -> C:\boost_1_90_0)
          # Use Boost official artifactory (more reliable than SourceForge in CI)
          # -------------------------
          $boostVersion = "1.90.0"
          $boostU       = "1_90_0"
          $boostRoot    = "C:\boost_$boostU"
          $boostZip     = "$env:RUNNER_TEMP\boost_$boostU.zip"

          # Prefer official Boost release host
          $boostUrlPrimary = "https://boostorg.jfrog.io/artifactory/main/release/$boostVersion/source/boost_$boostU.zip"
          # Fallback (rarely needed)
          $boostUrlFallback = "https://archives.boost.io/release/$boostVersion/source/boost_$boostU.zip"

          if (Test-Path $boostRoot) { Remove-Item -Recurse -Force $boostRoot }

          function Download-File($url, $outFile) {
            Write-Host "Downloading: $url"
            Invoke-WebRequest -Uri $url -OutFile $outFile -MaximumRedirection 10 -TimeoutSec 600
            if (!(Test-Path $outFile)) { throw "Download failed: $url (no output file)" }

            # quick sanity: zip files start with 'PK'
            $fs = [System.IO.File]::OpenRead($outFile)
            try {
              $b1 = $fs.ReadByte()
              $b2 = $fs.ReadByte()
              if ($b1 -ne 0x50 -or $b2 -ne 0x4B) {
                throw "Downloaded file is not a ZIP (bad signature). URL may have returned HTML."
              }
            } finally {
              $fs.Dispose()
            }
          }

          if (Test-Path $boostZip) {
            Write-Host "Using cached Boost archive; verifying its ZIP signature."
            $fs = [System.IO.File]::OpenRead($boostZip)
            try {
              if ($fs.ReadByte() -ne 0x50 -or $fs.ReadByte() -ne 0x4B) {
                Remove-Item -Force $boostZip
              }
            } finally {
              $fs.Dispose()
            }
          }
          if (!(Test-Path $boostZip)) {
            try {
              Download-File $boostUrlPrimary $boostZip
            } catch {
              Write-Host "Primary Boost URL failed: $($_.Exception.Message)"
              Download-File $boostUrlFallback $boostZip
            }
          }

          Expand-Archive -Path $boostZip -DestinationPath "C:\" -Force

          if (!(Test-Path (Join-Path $boostRoot "boost\version.hpp"))) {
            throw "Boost headers missing: expected $(Join-Path $boostRoot 'boost\version.hpp')"
          }

          "TONATIUH_BOOST_ROOT=$boostRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TONATIUH_BOOST_ROOT=$boostRoot"

          # -------------------------
          # Eigen headers (zip -> C:\eigen-5.0.0)
          # Robust to GitLab archive folder naming
          # -------------------------
          $eigenVersion = "5.0.0"
          $eigenRoot    = "C:\eigen-$eigenVersion"
          $eigenZip     = "$env:RUNNER_TEMP\eigen-$eigenVersion.zip"
          $eigenUrl     = "https://gitlab.com/libeigen/eigen/-/archive/$eigenVersion/eigen-$eigenVersion.zip"

          if (Test-Path $eigenRoot) { Remove-Item -Recurse -Force $eigenRoot }
          New-Item -ItemType Directory -Path $eigenRoot | Out-Null

          if (Test-Path $eigenZip) {
            Write-Host "Using cached Eigen archive; verifying its ZIP signature."
            $fs = [System.IO.File]::OpenRead($eigenZip)
            try {
              if ($fs.ReadByte() -ne 0x50 -or $fs.ReadByte() -ne 0x4B) {
                Remove-Item -Force $eigenZip
              }
            } finally {
              $fs.Dispose()
            }
          }
          if (!(Test-Path $eigenZip)) {
            Write-Host "Downloading Eigen headers: $eigenUrl"
            Download-File $eigenUrl $eigenZip
          }

          # Extract into a temp folder first
          $eigenExtract = Join-Path $env:RUNNER_TEMP "eigen_extract_$eigenVersion"
          if (Test-Path $eigenExtract) { Remove-Item -Recurse -Force $eigenExtract }
          Expand-Archive -Path $eigenZip -DestinationPath $eigenExtract -Force

          # Find the directory that contains Eigen/Core
          $eigenInner = Get-ChildItem -Path $eigenExtract -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName "Eigen\Core") } |
            Select-Object -First 1

          if (-not $eigenInner) {
            Write-Host "Debug listing of extracted Eigen archive (top level):"
            Get-ChildItem -Path $eigenExtract | Format-Table -AutoSize | Out-String | Write-Host
            throw "Eigen headers missing: could not locate Eigen\Core anywhere under $eigenExtract"
          }

          # Copy the located Eigen root into the stable path C:\eigen-<ver>
          Copy-Item -Path (Join-Path $eigenInner.FullName "*") -Destination $eigenRoot -Recurse -Force

          if (!(Test-Path (Join-Path $eigenRoot "Eigen\Core"))) {
            throw "Eigen headers missing after copy: expected $(Join-Path $eigenRoot 'Eigen\Core')"
          }

          "TONATIUH_EIGEN_ROOT=$eigenRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TONATIUH_EIGEN_ROOT=$eigenRoot"

      # Cache third_party outputs (Option 1)
      - name: Cache third_party deps
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            third_party/_install
            third_party/_build
          # Cache validity follows dependency inputs, not routine CI YAML edits.
          key: deps-v2-qt6.6.3-${{ runner.os }}-${{ hashFiles(
            'scripts/build_deps.py',
            'scripts/scrub_macos_agl_generated_links.py',
            'third_party/deps.yaml',
            'cmake/**',
            'source/CMakeLists.txt') }}

      - name: Build third-party dependencies
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          mkdir -p third_party/_build third_party/_install
          python scripts/build_deps.py

      - name: Configure (CMake)
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          cmake -S source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Scrub macOS generated AGL links
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os == 'macOS') }}
        shell: bash
        run: |
          python scripts/scrub_macos_agl_generated_links.py --build-dir build

      - name: Build
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      # On Windows, the runtime loader does not search sibling CMake target
      # output directories. Make the freshly built DLLs available before
      # CTest performs PRE_TEST GoogleTest discovery.
      - name: Add Windows test runtime DLL paths
        if: ${{ steps.changes.outputs.docs_only != 'true' && (runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $runtimeDirs = @(
            'build/libraries',
            'build/kernel',
            'build/SunPath',
            'third_party/_install/bin'
          )
          foreach ($relativeDir in $runtimeDirs) {
            $directory = Join-Path $env:GITHUB_WORKSPACE $relativeDir
            if (Test-Path -LiteralPath $directory -PathType Container) {
              Write-Host "Adding runtime DLL directory to PATH: $directory"
              Add-Content -LiteralPath $env:GITHUB_PATH -Value $directory
            }
          }

      - name: Verify headless tests are registered
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          ctest --test-dir build -N -R '^headless[.]' > build/headless-discovery.txt
          cat build/headless-discovery.txt
          grep -Fq 'headless.trace_cylinder_scene' build/headless-discovery.txt
          grep -Fq 'headless.benchmark_repeatability' build/headless-discovery.txt
          grep -Fq 'headless.run_script_cylinder_scene' build/headless-discovery.txt
          grep -Fq 'headless.validate_heliostat_scene' build/headless-discovery.txt
          grep -Fq 'headless.benchmark_heliostat_10k' build/headless-discovery.txt
          grep -Fq 'headless.benchmark_heliostat_1m_repeatability' build/headless-discovery.txt

      - name: Test
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure

      - name: Upload build artifacts
        if: ${{ always() && steps.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            build
            cmake/LocalDepsHints.cmake
